services:
  frontend:
    build: ./front
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
    depends_on:
      - backend

  backend:
    build: ./project
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres_project_db:5432/project-db
      - DB_USERNAME=admin
      - DB_PASSWORD=admin
    depends_on:
      - postgres_project_db

  postgres_project_db:
    image: postgres:17-alpine3.22
    container_name: postgres_project_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=project-db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - "5432:5432" # 5432 - может быть занят
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: