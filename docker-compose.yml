services:
  frontend:
    build: ./front
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=${BACKEND_URL}
    depends_on:
      - backend

  backend:
    build: ./project
    container_name: project_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_project_db:5432/project-db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - postgres_project_db

  postgres_project_db:
    image: postgres:17-alpine3.22
    container_name: postgres_project_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=project-db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - "5432:5432" # 5432 - может быть занят
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: