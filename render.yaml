services:
  # Frontend (React)
  - type: web
    name: project-manager-frontend
    env: docker
    dockerfilePath: ./front/Dockerfile
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 3000
      - key: REACT_APP_API_URL
        value: https://project-manager-backend.onrender.com/api

  # Backend (Spring Boot)
  - type: web
    name: project-manager-backend
    env: docker
    dockerfilePath: ./project/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: project-manager-db
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: FRONTEND_URL
        value: https://project-manager-frontend.onrender.com

# PostgreSQL Database
databases:
  - name: project-manager-db
    databaseName: project_manager
    user: project_user
    plan: free
